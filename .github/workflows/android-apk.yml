name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name=nogueira_gestao --org=pt.nogueira /tmp/ng_scaffold
          cp -R /tmp/ng_scaffold/android ./android
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
        continue-on-error: true
      - name: Run tests
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nogueira-Gestao-APK
          path: build/app/outputs/flutter-apk/app-release.apk
